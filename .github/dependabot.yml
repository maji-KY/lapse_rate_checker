version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # pnpm は公開直後の版を入れない（minimumReleaseAge）ため、提案も数日待ってから出す
    cooldown:
      default-days: 3
    groups:
      dev-tools:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
